<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GNN 可視化</title><style>body{font:16px system-ui,sans-serif;background:#f1f5f9;color:#172537;margin:0}main{max-width:960px;margin:auto;padding:24px}section{background:white;border:1px solid #dbe3ec;border-radius:12px;padding:24px;margin:20px 0}h1{font-size:30px}h2{font-size:21px}svg{width:100%;height:auto}label{display:block;margin:10px 0}input{width:55%;vertical-align:middle}table{border-collapse:collapse;width:100%;text-align:center}td,th{padding:9px;border-bottom:1px solid #ddd}.match{background:#dcfce7}.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.node{padding:12px;border:1px solid #94a3b8;border-radius:8px}button{padding:8px 16px}small{color:#526174}</style></head><body><main><h1>GNN — 大域的最近傍法</h1><p>局所最明点の対応付けを可視化する学習用デモ</p><section><h2>1. 処理フロー</h2><div class="flow" id="flow"></div><p>画像自体ではなく、抽出された座標と既存トラックを比較する。</p><svg id="frames" viewBox="0 0 780 210"></svg></section><section><h2>2. NN と GNN の比較</h2><p>一次元座標を変更して、逐次貪欲割当と全体最適割当を比較できます。</p><div id="controls"></div><button id="reset">初期値に戻す</button><svg id="compare" viewBox="0 0 780 260"></svg><div id="comparison"></div></section><section><h2>3. ゲーティングとコスト行列</h2><label>ゲート半径 <output id="radius">30</output> px <input id="gate" type="range" min="5" max="150" value="30"></label><svg id="points" viewBox="0 0 780 420"></svg><div id="matrix"></div><p id="result"></p><small>未割当トラックのコストをゲート半径＋1、未割当観測のコストを0とした例。小規模な全探索で最適解を計算します。</small></section><section><h2>4. 継続追跡とライフサイクル</h2><svg id="life" viewBox="0 0 780 240"></svg><p>初回の検出からトラックを生成し、次回以降は状態を引き継ぐ。GNNは対応付けを担当し、確定・削除は別の管理処理が担当する。</p></section></main><script>
'use strict';
const $=id=>document.getElementById(id), blue='#2563eb',orange='#ea580c',green='#16a34a';
const text=(x,y,s,c='#334155')=>`<text x="${x}" y="${y}" fill="${c}" font-size="15" text-anchor="middle">${s}</text>`;
const dot=(x,y,c,r=6)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const line=(x,y,a,b,c=green)=>`<line x1="${x}" y1="${y}" x2="${a}" y2="${b}" stroke="${c}" stroke-width="2"/>`;
$('flow').innerHTML=['画像取得','局所最明点抽出','状態予測','ゲーティング','コスト行列','最適割当','状態更新'].map(s=>`<span class="node">${s}</span>`).join(' → ');
$('frames').innerHTML=[0,1,2].map(k=>{let x=10+k*260;return `<rect x="${x}" y="30" width="240" height="165" rx="8" fill="#172337"/>`+text(x+120,20,`Frame ${k+1}`)+[[40+k*25,60+k*10,blue,'A'],[190-k*25,150-k*10,green,'B']].map(([a,b,c,n])=>`<circle cx="${x+a}" cy="${b}" r="13" fill="${c}" opacity=".4"/>`+dot(x+a,b,'white',4)+text(x+a+22,b,n,'white')).join('')+dot(x+120,175-k*20,orange,3)}).join('');
const initial=[40,65,55,10];let v=[...initial];$('controls').innerHTML=['T1','T2','Z1','Z2'].map((n,i)=>`<label>${n} <output id="o${i}">${v[i]}</output> <input id="s${i}" type="range" min="0" max="100" value="${v[i]}"></label>`).join('');
function table(c,a){return '<table><thead><tr><th>コスト</th>'+c[0].map((_,j)=>`<th>Z${j+1}</th>`).join('')+'</tr></thead><tbody>'+c.map((r,i)=>`<tr><th>T${i+1}</th>`+r.map((n,j)=>`<td class="${a[i]===j?'match':''}">${Number.isFinite(n)?n.toFixed(1):'∞'}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}
// 全探索：小規模デモ専用。観測の重複割当を禁止する。
function solve(c,miss){let best=Infinity,assignment=[];function visit(i,used,a,sum){if(i===c.length){if(sum<best){best=sum;assignment=[...a]}return}if(sum>=best)return;for(let j=0;j<c[i].length;j++){if(!used.has(j)&&Number.isFinite(c[i][j])){used.add(j);visit(i+1,used,[...a,j],sum+c[i][j]);used.delete(j)}}if(Number.isFinite(miss))visit(i+1,used,[...a,-1],sum+miss)}visit(0,new Set(),[],0);return {assignment,best}}
function compare(){let c=v.slice(0,2).map(t=>v.slice(2).map(z=>Math.abs(t-z))),j=c[0][0]<=c[0][1]?0:1,nn=[j,1-j],g=solve(c,Infinity),n=c[0][j]+c[1][1-j];$('compare').innerHTML=[nn,g.assignment].map((a,k)=>{let y=25+k*125,x=p=>60+p*6.6;return text(390,y,k?'GNN':'NN（T1優先）')+a.map((j,i)=>line(x(v[i]),y+25,x(v[j+2]),y+85,k?green:orange)).join('')+v.map((p,i)=>dot(x(p),y+(i<2?25:85),i<2?blue:orange)+text(x(p),y+(i<2?18:109),(i<2?'T':'Z')+(i%2+1))).join('')}).join('');$('comparison').innerHTML=`<p>NN合計: <b>${n}</b> ／ GNN合計: <b>${g.best}</b></p>`+table(c,g.assignment)}
v.forEach((_,i)=>$('s'+i).oninput=e=>{v[i]=+e.target.value;$('o'+i).value=v[i];compare()});$('reset').onclick=()=>{v=[...initial];v.forEach((n,i)=>{$('s'+i).value=n;$('o'+i).value=n});compare()};compare();
const t=[[100,100],[200,150],[300,200]],z=[[105,103],[198,148],[310,205],[500,300],[110,115]];
function gating(){let r=+$('gate').value;$('radius').value=r;let c=t.map(p=>z.map(q=>{let d=Math.hypot(p[0]-q[0],p[1]-q[1]);return d<=r?d:Infinity})),g=solve(c,r+1),x=p=>35+p*1.25,y=p=>25+p*1.1;$('points').innerHTML=t.map((p,i)=>`<ellipse cx="${x(p[0])}" cy="${y(p[1])}" rx="${r*1.25}" ry="${r*1.1}" fill="#dbeafe" fill-opacity=".35" stroke="${blue}" stroke-dasharray="5 4"/>`+(g.assignment[i]>=0?line(x(p[0]),y(p[1]),x(z[g.assignment[i]][0]),y(z[g.assignment[i]][1])):'')+dot(x(p[0]),y(p[1]),blue)+text(x(p[0])-15,y(p[1])-12,'T'+(i+1),blue)).join('')+z.map((p,j)=>dot(x(p[0]),y(p[1]),orange,4)+text(x(p[0])+17,y(p[1])+17,'Z'+(j+1),orange)).join('');$('matrix').innerHTML=table(c,g.assignment);$('result').textContent=g.assignment.map((j,i)=>`T${i+1} → ${j<0?'未割当':'Z'+(j+1)}`).join(' / ')+'　総コスト: '+g.best.toFixed(2)}$('gate').oninput=gating;gating();
const node=(x,y,s)=>`<rect x="${x}" y="${y}" width="135" height="45" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>`+text(x+67.5,y+28,s);$('life').innerHTML='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>'+[[145,42,210,42],[345,42,410,42],[477,65,477,135],[545,157,630,157]].map(a=>`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" stroke="#64748b" marker-end="url(#arrow)"/>`).join('')+node(10,20,'新規検出')+node(210,20,'仮トラック')+node(410,20,'確定トラック')+node(410,135,'予測追跡')+node(630,135,'削除')+text(377,30,'確定')+text(530,105,'未検出')+text(592,145,'長期未検出')+'<path d="M410 157 H380 V65 H410" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>'+text(345,115,'再検出');
</script></body></html>
